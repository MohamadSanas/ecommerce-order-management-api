[project]
name = "ecommerce-order-management-api"
version = "0.1.0"
description = "E-Commerce Order Management API for SimHealth Internship Prep"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by ruff format)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
